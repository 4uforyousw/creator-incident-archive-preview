name: Bootstrap static preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror
        uses: actions/checkout@v7

      - name: Restore validated preview artifact
        run: |
          set -euo pipefail
          base64 --decode preview.zip.b64 > /tmp/preview.zip
          mkdir -p /tmp/preview
          unzip -q /tmp/preview.zip -d /tmp/preview
          test -f /tmp/preview/index.html
          test -f /tmp/preview/robots.txt
          grep -q 'noindex,nofollow' /tmp/preview/index.html
          grep -q 'Disallow: /' /tmp/preview/robots.txt

      - name: Replace mirror contents with static artifact
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/preview/. .
          printf '\n' > .nojekyll

      - name: Commit static preview only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deploy: publish validated static preview'
          git push origin HEAD:main
