name: Bootstrap static preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror
        uses: actions/checkout@v7

      - name: Verify staged artifact chunks
        run: |
          set -euo pipefail
          cat > /tmp/chunks.sha256 <<'EOF'
          1cfed27520e5d5fc157946667cfa1c20deeff774953ec5d1daabceea9872c85d  preview.p00a
          ca8bd019570c6c411be8aaa2c2dafd876a9c3e65ee6d673f19c5ff72bd67ea2f  preview.p00b
          0ce5171d4930b68a570183d938121137df498b175eb8df2a52771657dbaee466  preview.p00c
          3c72711f2b56a7df3e1aea1650603e4ed01bb703f6d37488cc575fdb1cdeb0df  preview.part01
          f21131df08aa60337a821c03da2091971622e611dbf10e38cab80ddb84682e94  preview.part02
          4b3288f463cdd539cbe700f3b0d738af76c3f25caba218a57e4f27f5c65f34a3  preview.p03a
          d4b24fca7a47c8374c7409af22b6a18a4a810540d4390dffe2e32ec883b4502e  preview.p03b0
          306aa7fe89f8b49f157879c12f9e36304966c7b92777b7c5899aac67b1371f9b  preview.p03b10
          5b4ea715795223f7b406f5e9a0b1f11a4db6af0df0e21da50899df08e0ac9053  preview.p03b11
          56272b61d417db08dac14df5a8ac1c9bd8394b3c80f443752286fc7fc4b0f378  preview.p03b2
          ee06ae598a6168d716b42f7b17bcf5a001596fd3989e30363e64696d80330207  preview.p03b3
          c3ef0720e48c85e3590126f3f6ea581634f1dfcdee94322e15d1a21032208202  preview.p03c
          5313f623f08f81d5ef71453b7e076feaa96d34fbb3873f0bd0704c8b249b0c60  preview.p040
          6fece3297db9954f2534e05dd52b993dacb6f4e9ad505d0b7503fd437a410adb  preview.p041
          942b4690d269c4b5b9d0f8980349380186855273a4a00e7e02c5c503a63d04e8  preview.p042
          a3fcbf73e0c3e6b6315a907d00dfadbde6f592315cb9e8f8a346c3989701f6d8  preview.p0430
          92de37c76f0368be46df63ea3ff340cadacffa0403e3e1aeb3b3c6ce7aa75954  preview.p0431
          3df9d81679faf4802106ef40ecbe72b6d1981ebeed9943c6a572b014843e0035  preview.p0432
          ab39cc692541781979a19c3445aa4329a0b677485688102f7a7819c6d8ab005e  preview.part05
          EOF
          sha256sum -c /tmp/chunks.sha256

      - name: Restore validated preview artifact
        run: |
          set -euo pipefail
          cat \
            preview.p00a preview.p00b preview.p00c \
            preview.part01 preview.part02 \
            preview.p03a preview.p03b0 preview.p03b10 preview.p03b11 preview.p03b2 preview.p03b3 preview.p03c \
            preview.p040 preview.p041 preview.p042 preview.p0430 preview.p0431 preview.p0432 preview.part05 \
            | base64 --decode > /tmp/preview.zip
          test "$(sha256sum /tmp/preview.zip | awk '{print $1}')" = "264d9a0f455c4e6722eef76b8711a011d07b528765f690eeeb513639c70ef1e2"
          mkdir -p /tmp/preview
          unzip -q /tmp/preview.zip -d /tmp/preview
          test -f /tmp/preview/index.html
          test -f /tmp/preview/robots.txt
          grep -q 'noindex,nofollow' /tmp/preview/index.html
          grep -q 'Disallow: /' /tmp/preview/robots.txt

      - name: Replace mirror contents with static artifact
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/preview/. .
          printf '\n' > .nojekyll

      - name: Commit static preview only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deploy: publish validated static preview'
          git push origin HEAD:main
